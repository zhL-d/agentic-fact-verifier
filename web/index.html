<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Agentic Fact Verifier</title>
<style>
  :root {
    --paper: #F1F4F7;
    --surface: #FFFFFF;
    --ink: #171B22;
    --ink-muted: #57616F;
    --ink-faint: #8893A0;
    --rule: #D7DEE6;
    --rule-strong: #B9C4CE;
    --accent: #2C4A6E;
    --accent-soft: #E4EAF2;
    --v-supported: #2F7D4F;
    --v-supported-soft: #E3F0E7;
    --v-refuted: #B23A34;
    --v-refuted-soft: #F5E4E3;
    --v-insufficient: #A67C00;
    --v-insufficient-soft: #F4EBD8;
    --v-conflicting: #B5651D;
    --v-conflicting-soft: #F4E6D8;

    --font-display: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --font-mono: 'SF Mono', 'Cascadia Code', 'Menlo', Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #10141B; --surface: #171C24;
      --ink: #E7EAEE; --ink-muted: #9AA5B1; --ink-faint: #6B7684;
      --rule: #262E3A; --rule-strong: #333D4B;
      --accent: #7C9CC4; --accent-soft: #1E2A3D;
      --v-supported: #4F9B6E; --v-supported-soft: #16241C;
      --v-refuted: #D2635C; --v-refuted-soft: #2A1B1A;
      --v-insufficient: #D1A23A; --v-insufficient-soft: #2A2216;
      --v-conflicting: #D68A4C; --v-conflicting-soft: #2A2018;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
  .page { max-width: 760px; margin: 0 auto; padding: 40px 24px 80px; display: flex; flex-direction: column; gap: 24px; }

  .masthead { display: flex; align-items: baseline; justify-content: space-between; border-bottom: 1px solid var(--rule-strong); padding-bottom: 14px; }
  .masthead .brand { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-muted); }
  .masthead a { font-family: var(--font-mono); font-size: 12px; color: var(--accent); text-decoration: none; cursor: pointer; }
  .masthead a:hover { text-decoration: underline; }

  /* ---------- picker ---------- */
  .intro { font-size: 14.5px; color: var(--ink-muted); max-width: 62ch; }
  .picker-list { display: flex; flex-direction: column; gap: 10px; }
  .picker-card {
    display: flex; align-items: center; gap: 12px; text-align: left; width: 100%;
    background: var(--surface); border: 1px solid var(--rule); border-radius: 3px; padding: 16px 18px;
    font-family: var(--font-body); font-size: 14px; color: var(--ink); cursor: pointer;
  }
  .picker-card:hover, .picker-card:focus-visible { border-color: var(--accent); outline: none; }
  .picker-badge { flex: none; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; padding: 3px 8px; border-radius: 3px; background: var(--rule); color: var(--ink-muted); }
  .picker-badge.supported { background: var(--v-supported-soft); color: var(--v-supported); }
  .picker-badge.refuted { background: var(--v-refuted-soft); color: var(--v-refuted); }
  .picker-badge.conflicting { background: var(--v-conflicting-soft); color: var(--v-conflicting); }
  .picker-badge.insufficient { background: var(--v-insufficient-soft); color: var(--v-insufficient); }
  .picker-claim { flex: 1; }

  /* ---------- spinner ---------- */
  .loading { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 80px 0; color: var(--ink-muted); font-family: var(--font-mono); font-size: 13px; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--rule); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- exhibit header ---------- */
  .exhibit-header { background: var(--surface); border: 1px solid var(--rule); border-radius: 3px; padding: 28px 30px; position: relative; overflow: hidden; }
  .exhibit-label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; display: block; }
  .claim-text { font-family: var(--font-display); font-size: 22px; line-height: 1.45; color: var(--ink); text-wrap: balance; max-width: 62ch; margin: 0 0 18px 0; font-style: italic; }
  .claim-meta { display: flex; gap: 18px; font-family: var(--font-mono); font-size: 12px; color: var(--ink-muted); flex-wrap: wrap; }
  .claim-meta b { color: var(--ink); font-weight: 600; }
  .stamp {
    position: absolute; top: 24px; right: 30px; transform: rotate(-8deg);
    border: 3px solid var(--v-insufficient); color: var(--v-insufficient);
    font-family: var(--font-display); font-weight: 700; font-size: 17px; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 7px 14px; border-radius: 4px; opacity: 0.92; background: color-mix(in srgb, var(--v-insufficient) 6%, transparent);
  }
  .stamp.supported { border-color: var(--v-supported); color: var(--v-supported); background: color-mix(in srgb, var(--v-supported) 6%, transparent); }
  .stamp.refuted { border-color: var(--v-refuted); color: var(--v-refuted); background: color-mix(in srgb, var(--v-refuted) 6%, transparent); }
  .stamp.conflicting { border-color: var(--v-conflicting); color: var(--v-conflicting); background: color-mix(in srgb, var(--v-conflicting) 6%, transparent); }
  .gold-note { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--rule); font-size: 12.5px; color: var(--ink-muted); font-family: var(--font-mono); }
  .gold-note .diff { color: var(--v-refuted); font-weight: 600; }
  .gold-note .match { color: var(--v-supported); font-weight: 600; }

  /* ---------- findings ---------- */
  .findings { background: var(--surface); border: 1px solid var(--rule); border-radius: 3px; padding: 22px 26px; }
  .section-title { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-muted); display: block; margin-bottom: 12px; }
  .findings p { font-size: 14.5px; line-height: 1.7; color: var(--ink); margin: 0; }
  .cite {
    font-family: var(--font-mono); font-size: 11.5px; color: var(--accent); background: var(--accent-soft);
    padding: 1px 6px; border-radius: 2px; text-decoration: none; cursor: pointer; white-space: nowrap; border: none;
  }
  .cite:hover, .cite:focus-visible { background: var(--accent); color: var(--surface); outline: none; }

  /* ---------- trace toggle ---------- */
  .view-toggle { display: flex; gap: 2px; background: var(--rule); border-radius: 4px; padding: 2px; width: fit-content; }
  .view-toggle button { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; border: none; background: transparent; color: var(--ink-muted); padding: 7px 14px; border-radius: 3px; cursor: pointer; }
  .view-toggle button.active { background: var(--surface); color: var(--ink); }
  .view-toggle button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .trace { display: flex; flex-direction: column; gap: 12px; }
  .trace[hidden] { display: none; }

  .exhibit-card { background: var(--surface); border: 1px solid var(--rule); border-radius: 3px; overflow: hidden; }
  .exhibit-card-head { display: flex; align-items: flex-start; gap: 12px; padding: 15px 18px; border-bottom: 1px solid var(--rule); }
  .status-chip { flex: none; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 8px; border-radius: 3px; margin-top: 2px; white-space: nowrap; }
  .status-chip.resolved { color: var(--v-supported); background: var(--v-supported-soft); }
  .status-chip.unresolved { color: var(--v-refuted); background: var(--v-refuted-soft); }
  .exhibit-card-head .question { font-size: 14.5px; font-weight: 600; color: var(--ink); flex: 1; }
  .exhibit-card-body { padding: 6px 18px 16px; display: flex; flex-direction: column; gap: 4px; }

  .round-history { display: flex; flex-direction: column; }
  .round-entry-wrap { border-bottom: 1px dashed var(--rule); }
  .round-entry-wrap:last-child { border-bottom: none; }
  .round-entry {
    display: grid; grid-template-columns: 70px 1fr auto 16px; gap: 12px; align-items: baseline;
    padding: 10px 0; font-size: 12.5px; background: transparent; border: none; width: 100%; text-align: left; cursor: pointer; font-family: var(--font-body);
  }
  .round-entry:hover, .round-entry:focus-visible { background: var(--accent-soft); outline: none; }
  .round-tag { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.05em; color: var(--ink-faint); text-transform: uppercase; }
  .round-query { color: var(--ink-muted); }
  .round-query .label { color: var(--ink-faint); font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; margin-right: 6px; }
  .round-outcome { font-family: var(--font-mono); font-size: 11.5px; white-space: nowrap; text-align: right; }
  .round-outcome.gain { color: var(--ink-muted); }
  .round-outcome.resolved-now { color: var(--v-supported); font-weight: 600; }
  .round-outcome.still-open { color: var(--v-refuted); }
  .round-entry .chevron { color: var(--ink-faint); font-size: 11px; transition: transform 0.15s ease; }
  .round-entry:hover .chevron { color: var(--accent); }
  .round-entry[aria-expanded="true"] .chevron { transform: rotate(90deg); }

  .round-evidence { padding: 0 0 12px 18px; border-left: 2px solid var(--rule); margin-left: 6px; }
  .round-evidence[hidden] { display: none; }

  .reasoning { font-size: 13.5px; color: var(--ink-muted); line-height: 1.6; margin: 12px 0 10px; }

  .evidence-list { display: flex; flex-direction: column; gap: 2px; }
  .evidence-row {
    display: flex; gap: 10px; align-items: baseline; font-size: 12.5px;
    padding: 5px 4px; margin: 0 -4px; border-radius: 3px; cursor: pointer; border: none; background: transparent; width: 100%; text-align: left; font-family: var(--font-body);
  }
  .evidence-row:hover, .evidence-row:focus-visible { background: var(--accent-soft); outline: none; }
  .evidence-tag { font-family: var(--font-mono); font-size: 11px; color: var(--accent); background: var(--accent-soft); padding: 1px 6px; border-radius: 2px; flex: none; }
  .evidence-row .url { color: var(--ink-muted); overflow-wrap: anywhere; border-bottom: 1px solid var(--rule-strong); }
  .evidence-row:hover .url { color: var(--accent); border-color: var(--accent); }
  .evidence-row .chevron { margin-left: auto; color: var(--ink-faint); font-family: var(--font-mono); font-size: 11px; transition: transform 0.15s ease; }
  .evidence-row[aria-expanded="true"] .chevron { transform: rotate(90deg); }
  .cited-badge { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--v-supported); background: var(--v-supported-soft); padding: 1px 6px; border-radius: 2px; flex: none; }

  .evidence-detail { font-size: 12.5px; color: var(--ink-muted); background: var(--paper); border: 1px solid var(--rule); border-radius: 3px; padding: 12px 14px; margin: 2px 0 8px; line-height: 1.6; }
  .evidence-detail[hidden] { display: none; }
  .evidence-detail .found-via { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.04em; display: block; margin-bottom: 8px; }
  .evidence-detail .excerpt { font-style: italic; color: var(--ink); white-space: pre-wrap; }

  footer.foot { text-align: center; font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); letter-spacing: 0.04em; padding-top: 8px; }
</style>
</head>
<body>
<div class="page" id="page"></div>

<script>
(function () {
  const LABEL_CLASS = {
    "Supported": "supported",
    "Refuted": "refuted",
    "Conflicting Evidence/Cherrypicking": "conflicting",
    "Not Enough Evidence": "insufficient",
  };

  const page = document.getElementById("page");
  let evidenceIndexByThread = [];
  let globalFirstOccurrence = {};

  function el(tag, opts, children) {
    const e = document.createElement(tag);
    if (opts) {
      for (const [k, v] of Object.entries(opts)) {
        if (k === "class") e.className = v;
        else if (k === "text") e.textContent = v;
        else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
        else e.setAttribute(k, v);
      }
    }
    (children || []).forEach((c) => e.appendChild(c));
    return e;
  }

  async function loadPicker() {
    evidenceIndexByThread = [];
    globalFirstOccurrence = {};
    page.innerHTML = "";
    page.appendChild(
      el("div", { class: "masthead" }, [
        el("div", { class: "brand", text: "Agentic Fact Verifier · AVeriTeC docket" }),
      ])
    );
    page.appendChild(
      el("p", {
        class: "intro",
        text: "Pick a claim below. This runs the real agentic pipeline (decompose → retrieve → check sufficiency → retry/verdict) live against pre-ingested, per-claim evidence — not open web search, so only claims already in the AVeriTeC dev set can be verified.",
      })
    );
    const list = el("div", { class: "picker-list" });
    page.appendChild(list);

    const claims = await (await fetch("/api/claims")).json();
    claims.forEach((c) => {
      const badgeClass = LABEL_CLASS[c.gold_label] || "";
      const badge = el("span", { class: "picker-badge" + (badgeClass ? " " + badgeClass : ""), text: c.gold_label });
      const card = el(
        "button",
        { class: "picker-card", onclick: () => loadDocket(c.claim_id) },
        [badge, el("span", { class: "picker-claim", text: c.claim })]
      );
      list.appendChild(card);
    });
  }

  async function loadDocket(claimId) {
    evidenceIndexByThread = [];
    globalFirstOccurrence = {};
    page.innerHTML = "";
    page.appendChild(
      el("div", { class: "masthead" }, [
        el("div", { class: "brand", text: "Agentic Fact Verifier · AVeriTeC docket" }),
        el("a", { onclick: loadPicker, text: "← back to claims" }),
      ])
    );
    page.appendChild(
      el("div", { class: "loading" }, [
        el("div", { class: "spinner" }),
        el("div", { text: "Running the agentic loop — this takes a while (multiple LLM calls per round)…" }),
      ])
    );

    try {
      const res = await fetch("/api/verify/" + claimId, { method: "POST" });
      if (!res.ok) {
        let detail = res.statusText;
        try { detail = (await res.json()).detail || detail; } catch (e) {}
        throw new Error(detail);
      }
      const data = await res.json();
      renderDocket(data);
    } catch (err) {
      page.innerHTML = "";
      page.appendChild(
        el("div", { class: "masthead" }, [
          el("div", { class: "brand", text: "Agentic Fact Verifier · AVeriTeC docket" }),
          el("a", { onclick: loadPicker, text: "← back to claims" }),
        ])
      );
      page.appendChild(
        el("div", { class: "findings" }, [
          el("span", { class: "section-title", text: "Run failed" }),
          el("p", { text: String(err.message || err) }),
          el("p", { style: "margin-top: 14px" }, [
            el("button", { class: "cite", onclick: () => loadDocket(claimId), text: "Retry" }),
          ]),
        ])
      );
    }
  }

  function renderDocket(data) {
    page.innerHTML = "";
    page.appendChild(
      el("div", { class: "masthead" }, [
        el("div", { class: "brand", text: "Agentic Fact Verifier · AVeriTeC docket" }),
        el("a", { onclick: loadPicker, text: "← back to claims" }),
      ])
    );

    const verdict = data.verdict;
    const labelClass = LABEL_CLASS[verdict.label] || "";
    const header = el("div", { class: "exhibit-header" });
    header.appendChild(el("span", { class: "exhibit-label", text: "Claim under review" }));
    header.appendChild(el("p", { class: "claim-text", text: "“" + data.claim + "”" }));
    const meta = el("div", { class: "claim-meta" });
    meta.appendChild(el("span", {}, [document.createTextNode("Rounds "), el("b", { text: String(data.rounds.length) })]));
    meta.appendChild(el("span", {}, [document.createTextNode("Evidence reviewed "), el("b", { text: String(data.all_evidence.length) })]));
    meta.appendChild(el("span", {}, [document.createTextNode("Sub-questions "), el("b", { text: String(data.threads.length) })]));
    header.appendChild(meta);
    header.appendChild(el("div", { class: "stamp" + (labelClass ? " " + labelClass : ""), text: verdict.label }));

    const matches = verdict.label === data.gold_label;
    const goldNote = el("div", { class: "gold-note" });
    goldNote.appendChild(document.createTextNode("Reference label (AVeriTeC dev set): "));
    goldNote.appendChild(el("b", { text: data.gold_label }));
    goldNote.appendChild(document.createTextNode(" — "));
    goldNote.appendChild(el("span", { class: matches ? "match" : "diff", text: matches ? "matches" : "differs" }));
    header.appendChild(goldNote);
    page.appendChild(header);

    const findings = el("div", { class: "findings" });
    findings.appendChild(el("span", { class: "section-title", text: "Findings" }));
    const p = el("p");
    p.appendChild(linkifyCitations(verdict.justification, data.all_evidence, null));
    findings.appendChild(p);
    page.appendChild(findings);

    // Result / trace toggle
    const trace = el("div", { class: "trace", hidden: "" });
    const btnOff = el("button", { class: "active", text: "Result only" });
    const btnOn = el("button", { text: "Show reasoning trace" });
    function setTrace(show) {
      trace.hidden = !show;
      btnOn.classList.toggle("active", show);
      btnOff.classList.toggle("active", !show);
    }
    btnOff.addEventListener("click", () => setTrace(false));
    btnOn.addEventListener("click", () => setTrace(true));
    page.appendChild(el("div", { class: "view-toggle" }, [btnOff, btnOn]));
    page.appendChild(trace);
    trace.appendChild(el("span", { class: "section-title", text: "Sub-questions — each tracked as its own thread; click a round to see exactly what it found" }));

    const citedTextToNumber = new Map();
    verdict.citations.forEach((n) => {
      const chunk = data.all_evidence[n - 1];
      if (chunk) citedTextToNumber.set(chunk.text, n);
    });

    data.threads.forEach((thread, ti) => {
      evidenceIndexByThread[ti] = {};
      const card = el("div", { class: "exhibit-card" });
      const statusLabel = thread.resolved ? "Resolved" : "Unresolved after " + data.rounds.length + " round" + (data.rounds.length === 1 ? "" : "s");
      card.appendChild(
        el("div", { class: "exhibit-card-head" }, [
          el("span", { class: "status-chip " + (thread.resolved ? "resolved" : "unresolved"), text: statusLabel }),
          el("span", { class: "question", text: thread.question }),
        ])
      );
      const body = el("div", { class: "exhibit-card-body" });
      const history = el("div", { class: "round-history" });

      data.rounds.forEach((round) => {
        const t = round.threads[ti];
        if (!t || t.queries_used.length === 0) return; // this thread wasn't queried this round (already resolved)
        const evidWrap = el("div", { class: "round-evidence", hidden: "" });
        const evidList = el("div", { class: "evidence-list" });
        t.new_evidence.forEach((chunk) => {
          const citeNumber = citedTextToNumber.get(chunk.text);
          const rowChildren = [
            el("span", { class: "evidence-tag", text: domainOf(chunk.url) }),
            el("span", { class: "url", text: chunk.url }),
          ];
          if (citeNumber !== undefined) {
            rowChildren.push(el("span", { class: "cited-badge", text: "Cited as [" + citeNumber + "]" }));
          }
          rowChildren.push(el("span", { class: "chevron", text: "▶" }));
          const detail = el("div", { class: "evidence-detail", hidden: "" }, [
            el("span", { class: "found-via", text: 'Found via: "' + chunk.retrieval_query + '"' }),
            el("span", { class: "excerpt", text: chunk.text }),
          ]);
          const row = el("button", {
            class: "evidence-row",
            "aria-expanded": "false",
            onclick: () => {
              const expanded = row.getAttribute("aria-expanded") === "true";
              row.setAttribute("aria-expanded", String(!expanded));
              detail.hidden = expanded;
            },
          }, rowChildren);
          evidList.appendChild(row);
          evidList.appendChild(detail);
          const entry = { getRoundBtn: () => roundBtn, row, detail };
          if (!(chunk.text in evidenceIndexByThread[ti])) {
            evidenceIndexByThread[ti][chunk.text] = entry;
          }
          if (!(chunk.text in globalFirstOccurrence)) {
            globalFirstOccurrence[chunk.text] = entry;
          }
        });
        evidWrap.appendChild(evidList);

        const outcomeClass = t.resolved ? "resolved-now" : (round.round === data.rounds.length ? "still-open" : "gain");
        const outcomeText = t.resolved ? "+" + t.n_new_evidence + " · resolved" : "+" + t.n_new_evidence + (round.round === data.rounds.length && !thread.resolved ? " · still unresolved" : "");
        const roundBtn = el(
          "button",
          {
            class: "round-entry",
            "aria-expanded": "false",
            onclick: () => {
              const expanded = roundBtn.getAttribute("aria-expanded") === "true";
              roundBtn.setAttribute("aria-expanded", String(!expanded));
              evidWrap.hidden = expanded;
            },
          },
          [
            el("span", { class: "round-tag", text: "Round " + round.round }),
            el("span", { class: "round-query" }, [
              el("span", { class: "label", text: round.round === 1 ? "query" : "refined" }),
              document.createTextNode('"' + t.queries_used.join('", "') + '"'),
            ]),
            el("span", { class: "round-outcome " + outcomeClass, text: outcomeText }),
            el("span", { class: "chevron", text: "▶" }),
          ]
        );
        history.appendChild(el("div", { class: "round-entry-wrap" }, [roundBtn, evidWrap]));
      });

      body.appendChild(history);
      const reasoningP = el("p", { class: "reasoning" });

      reasoningP.appendChild(linkifyCitations(thread.reasoning, thread.evidence, ti));
      body.appendChild(reasoningP);
      card.appendChild(body);
      trace.appendChild(card);
    });

    page.appendChild(el("footer", { class: "foot", text: "Agentic Fact Verifier · built on the AVeriTeC benchmark · verify_claim MCP tool" }));
  }

  function linkifyCitations(text, evidenceList, scopeThreadIndex) {
    const frag = document.createDocumentFragment();
    let lastIndex = 0;
    let match;

    const re = /\[(\d+(?:\s*,\s*\d+)*)\]/g;
    while ((match = re.exec(text)) !== null) {
      frag.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
      const numbers = match[1].split(",").map((s) => parseInt(s.trim(), 10));
      frag.appendChild(document.createTextNode("["));
      numbers.forEach((n, i) => {
        if (i > 0) frag.appendChild(document.createTextNode(", "));
        const chunk = evidenceList[n - 1];
        if (chunk) {
          frag.appendChild(el("button", { class: "cite", text: String(n), onclick: () => jumpToEvidence(chunk.text, scopeThreadIndex) }));
        } else {
          frag.appendChild(document.createTextNode(String(n)));
        }
      });
      frag.appendChild(document.createTextNode("]"));
      lastIndex = re.lastIndex;
    }
    frag.appendChild(document.createTextNode(text.slice(lastIndex)));
    return frag;
  }

  function domainOf(url) {
    try {
      return new URL(url).hostname.replace(/^www\./, "").split(".")[0].toUpperCase();
    } catch (e) {
      return "SRC";
    }
  }

  function jumpToEvidence(text, scopeThreadIndex) {
    let entry = null;
    if (scopeThreadIndex !== null && scopeThreadIndex !== undefined) {
      entry = evidenceIndexByThread[scopeThreadIndex] && evidenceIndexByThread[scopeThreadIndex][text];
    }
    if (!entry) entry = globalFirstOccurrence[text];
    if (!entry) return;
    const roundBtn = entry.getRoundBtn();
    if (roundBtn.getAttribute("aria-expanded") !== "true") roundBtn.click();
    entry.row.scrollIntoView({ behavior: "smooth", block: "center" });
    if (entry.row.getAttribute("aria-expanded") !== "true") entry.row.click();
    entry.row.style.outline = "2px solid var(--accent)";
    setTimeout(() => { entry.row.style.outline = ""; }, 1200);
  }

  loadPicker();
})();
</script>
</body>
</html>
