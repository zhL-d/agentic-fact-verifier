services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.1
    container_name: afv-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  mcp_server:
    build:
      context: .
      target: app
      args:
        BAKE_MODEL_WEIGHTS: "${BAKE_MODEL_WEIGHTS:-false}"
    command: ["uv", "run", "--no-sync", "python", "src/agentic_fact_verifier/mcp_server.py"]
    environment:
      - ES_URL=http://elasticsearch:9200
      - ES_INDEX_NAME=${ES_INDEX_NAME:-averitec_dev_chunks}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-ai/nomic-embed-text-v2-moe}
      - EMBEDDING_QUERY_PROMPT=${EMBEDDING_QUERY_PROMPT-query}
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=8100
      - MCP_SHARED_SECRET=${MCP_SHARED_SECRET}
    ports:
      - "8100:8100"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8100/mcp || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s # first startup loads the embedding model

  postgres:
    image: postgres:17-alpine
    container_name: afv-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-afv}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-afv}
      - POSTGRES_DB=${POSTGRES_DB:-afv_checkpoints}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-afv} -d ${POSTGRES_DB:-afv_checkpoints}"]
      interval: 10s
      timeout: 5s
      retries: 10

  judge_server:
    build:
      context: .
      target: app
    command: ["uv", "run", "--no-sync", "python", "src/agentic_fact_verifier/judge_server.py"]
    environment:
      - FIREWORKS_API_KEY=${FIREWORKS_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - VERDICT_LABELS=${VERDICT_LABELS:-}
      - JUDGE_SERVER_HOST=0.0.0.0
      - JUDGE_SERVER_PORT=8101
      - MCP_SHARED_SECRET=${MCP_SHARED_SECRET}
    ports:
      - "8101:8101"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8101/mcp || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api_server:
    build:
      context: .
      target: app
    command: ["uv", "run", "--no-sync", "uvicorn", "agentic_fact_verifier.api_server:app", "--app-dir", "src", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      - FIREWORKS_API_KEY=${FIREWORKS_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - MCP_SERVER_URL=http://mcp_server:8100/mcp
      - JUDGE_SERVER_URL=http://judge_server:8101/mcp
      - MCP_SHARED_SECRET=${MCP_SHARED_SECRET}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - LANGSMITH_ENDPOINT=${LANGSMITH_ENDPOINT:-}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-}
      - CHECKPOINT_DB_URL=postgresql://${POSTGRES_USER:-afv}:${POSTGRES_PASSWORD:-afv}@postgres:5432/${POSTGRES_DB:-afv_checkpoints}
    ports:
      - "8001:8000"
    volumes:
      - ./data:/app/data:ro # dev.json + knowledge store, gitignored, host-provided
    depends_on:
      mcp_server:
        condition: service_healthy
      judge_server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8000/api/claims || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  nginx:
    build:
      context: .
      target: nginx
    ports:
      - "8000:80" # http://localhost:8000, serves web/dist/, proxies /api/* to api_server
    depends_on:
      api_server:
        condition: service_healthy

volumes:
  es_data:
  postgres_data:
