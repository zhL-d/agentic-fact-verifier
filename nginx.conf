# Serves the built frontend (web/dist/) directly and reverse-proxies
# /api/* to api_server (FastAPI).

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api_server:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Verification requests run the full agentic pipeline —
        # multiple LLM calls, can take minutes.
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
